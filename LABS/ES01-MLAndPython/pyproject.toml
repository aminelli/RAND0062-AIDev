[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-ml-demo"
version = "0.1.0"
description = "Local synthetic purchase and churn prediction demo"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.136.3",
  "joblib==1.5.3",
  "numpy==2.4.2",
  "pandas==2.3.3",
  "pydantic==2.12.5",
  "pymongo==4.16.0",
  "scikit-learn==1.9.1",
  "streamlit==1.55.0",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated MongoDB test database"]
